[package]
name = "mp-server"
description = "MultiParity server: HTTP API, accounts, organizations, projects, branches, claims"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mp-server"
path = "src/main.rs"

[dependencies]
mp-core = { path = "../mp-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
zstd.workspace = true
hex.workspace = true
rand.workspace = true
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "limit"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
argon2 = "0.5"
object_store = { version = "0.11", features = ["aws"] }
async-trait = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
